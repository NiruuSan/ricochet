# Supply-chain policy: only install package versions published at least 7 days ago.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  bufferutil: false
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
overrides:
  # rpc-websockets (via @solana/web3.js) require()s uuid, but uuid 12+ ships
  # only ES modules. Runtimes without require(esm), such as Vercel Functions,
  # crash while loading every route that imports the payment service.
  # uuid 11 keeps a CommonJS build with the same v1() it uses.
  rpc-websockets>uuid: 11.1.1
  # Security patches for transitive dependencies (see `pnpm audit`).
  # ws: memory exhaustion DoS and uninitialized memory disclosure (libSQL, Solana RPC sockets).
  ws@>=8.0.0 <8.21.0: 8.21.3
  # jayson only calls uuid.v4(); uuid 11 keeps the CommonJS build and fixes the v3/v5/v6 bounds check.
  jayson>uuid: 11.1.1
  # stream-json: quadratic work on nested JSON blocks the event loop (jayson, Solana RPC replies).
  stream-json@<=3.4.0: 3.6.0
  # Build-time only (styled-jsx's Babel), patched anyway.
  browserslist@<4.28.7: 4.28.9
  baseline-browser-mapping@<2.11.0: 2.11.21
  "@babel/core@<7.29.1": 7.29.7
