# Supply-chain policy: only install package versions published at least 7 days ago.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  bufferutil: false
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
